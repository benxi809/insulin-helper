name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - run: flutter pub get
      - run: flutter test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug 2>&1
          echo "=== build output ==="
          find build/ -name "*.apk" -type f 2>/dev/null
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insulin-app
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          compression-level: 0
