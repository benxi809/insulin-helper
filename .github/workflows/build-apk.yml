name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify Flutter
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --debug 2>&1
          echo "=== list output files ==="
          find build/app/outputs -name "*.apk" -type f 2>/dev/null || echo "no apk files found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "no flutter-apk dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insulin-app
          path: |
            build/app/outputs/flutter-apk/*.apk
            !build/app/outputs/flutter-apk/*-unsigned.apk
          if-no-files-found: error
          compression-level: 0

